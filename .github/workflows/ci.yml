name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: toir
      POSTGRES_USER: toir
      POSTGRES_PASSWORD: ci-only-placeholder-password
      JWT_SECRET: ci-only-placeholder-jwt-secret-at-least-32-bytes
      CORS_ORIGINS: http://localhost:3000
      API_DOCS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
        working-directory: backend

  frontend-checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8010/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        env:
          POSTGRES_DB: toir
          POSTGRES_USER: toir
          POSTGRES_PASSWORD: ci-only-placeholder-password
          JWT_SECRET: ci-only-placeholder-jwt-secret-at-least-32-bytes
          CORS_ORIGINS: https://toir.example.invalid
          DOMAIN: toir.example.invalid
          API_DOCS_ENABLED: "false"
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag toir-backend:ci .
      - name: Build frontend image
        run: >-
          docker build --file Dockerfile --tag toir-frontend:ci
          --build-arg NEXT_PUBLIC_API_URL=https://toir.example.invalid/api/v1 .
