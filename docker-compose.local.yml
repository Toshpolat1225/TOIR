services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      CORS_ORIGINS: "http://localhost:3000"
      API_DOCS_ENABLED: "true"
      WIALON_SYNC_ENABLED: "false"

  frontend:
    ports:
      - "127.0.0.1:3000:3000"
    build:
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:18000/api/v1"