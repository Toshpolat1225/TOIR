services:
  backend:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CORS_ORIGINS: "http://localhost:3000"
      API_DOCS_ENABLED: "true"
      WIALON_SYNC_ENABLED: "false"

  frontend:
    ports:
      - "127.0.0.1:3000:3000"
    build:
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
