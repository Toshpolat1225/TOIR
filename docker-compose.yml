services:
  postgres:
    image: postgres:16.15-alpine
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    mem_limit: ${BACKEND_MEM:-1024m}  # the wagon mileage engine run needs more than 512m (exit 137 seen)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      WIALON_INGEST_TOKEN: ${WIALON_INGEST_TOKEN:-}
      SCALES_INGEST_TOKEN: ${SCALES_INGEST_TOKEN:-}
      WIALON_HOST: ${WIALON_HOST:-}
      WIALON_TOKEN: ${WIALON_TOKEN:-}
      WIALON_SYNC_INTERVAL_MINUTES: ${WIALON_SYNC_INTERVAL_MINUTES:-2}
      WIALON_SYNC_ENABLED: ${WIALON_SYNC_ENABLED:-false}
      GTK_HOST: ${GTK_HOST:-}
      GTK_USER: ${GTK_USER:-}
      GTK_PASSWORD: ${GTK_PASSWORD:-}
      GTK_PAGE_PATH: ${GTK_PAGE_PATH:-/railway/__railway_train/}
      GTK_PAGE_QUERY: ${GTK_PAGE_QUERY:-EnterprisesControlRB=1}
      GTK_SYNC_ENABLED: ${GTK_SYNC_ENABLED:-false}
      GTK_SYNC_INTERVAL_MINUTES: ${GTK_SYNC_INTERVAL_MINUTES:-10}
      GTK_GPS_SYNC_ENABLED: ${GTK_GPS_SYNC_ENABLED:-${GTK_SYNC_ENABLED:-false}}
      GTK_GPS_SYNC_INTERVAL_MINUTES: ${GTK_GPS_SYNC_INTERVAL_MINUTES:-10}
      GTK_UTC_OFFSET_HOURS: ${GTK_UTC_OFFSET_HOURS:-5}
      WAGON_MILEAGE_ENGINE_ENABLED: ${WAGON_MILEAGE_ENGINE_ENABLED:-true}
      WAGON_MILEAGE_TRACK_FALLBACK: ${WAGON_MILEAGE_TRACK_FALLBACK:-false}
      WHISPER_URL: ${WHISPER_URL:-http://whisper:9000}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      ASSISTANT_BROWSER_STT: ${ASSISTANT_BROWSER_STT:-true}
      DAILY_KM_ESTIMATE: ${DAILY_KM_ESTIMATE:-200}
      AD_AUTH_ENABLED: ${AD_AUTH_ENABLED:-false}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s  # migrations run first

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # relative: resolved against the address the page was opened from, so http:// and https:// both work
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks: [internal]
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/auth/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    image: caddy:2.11.7-alpine
    mem_limit: 128m
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Local speech-to-text for the voice command centre (CPU, free). Internal only (no published port); the backend does NOT depend on it:
  # without it the assistant simply has no microphone. The model is baked into the image at build time (see whisper/README.md).
  whisper:
    build:
      context: ./whisper
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    mem_limit: ${WHISPER_MEM:-1536m}
    cpus: ${WHISPER_CPUS:-2.0}
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=4)); sys.exit(0 if d.get('loaded') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Nightly verified database dumps into ./backups (auto-*.dump); see scripts/backup_loop.sh.
  backup:
    image: postgres:16.15-alpine
    mem_limit: 128m
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-21}
    entrypoint: ["sh", "/usr/local/bin/backup_loop.sh"]
    volumes:
      - ./backups:/backups
      - ./scripts/backup_loop.sh:/usr/local/bin/backup_loop.sh:ro
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config: